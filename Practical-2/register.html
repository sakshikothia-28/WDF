<!DOCTYPE html>
<html>
    <head>
        <title>Register</title>
        <link rel="stylesheet" href="/CSS/register.css">
    </head>
    <body>
    <div class="header">
        <img src="/Images/logo.png" class="logo" alt="StudentHub Logo">
        <h1 class="title">StudentHub</h1>
    <div class="navbar">
        <a href="/index.html">Home</a>
        <a href="profile.html">Profile</a>
    </div>
    </div>
    <div class="register-box">
    <h1>Create an Account</h1>
    <form>
        <input type="text" placeholder="Name"><br><br>
        <input type="text" placeholder="Student ID"><br><br>
        <input type="email" placeholder="College Email ID"><br><br>
        <input type="text" placeholder="Contact Number"><br><br>
    <p>Gender</p>
    <div class="gender">
        <input type="radio" id="male" name="gender">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender">
        <label for="female">Female</label>
    </div>
    <br>
        <select class="select-box">
            <option>Select Semester</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
        </select>
    <br><br>
        <select class="select-box">
            <option>Select Institute</option>
            <option>DEPSTAR</option>
            <option>CSPIT</option>
        </select>
    <br><br>
        <select class="select-box">
            <option>Select Department</option>
            <option>Computer Engineering</option>
            <option>Information Technology</option>
            <option>Computer Science Engineering</option>
    </select>
    <br><br>
        <input type="text" placeholder="Username"><br><br>
        <input type="password" placeholder="Password"><br><br><br>
        <button type="submit">Register</button>
    </form>
    <br>
    Already have an account?
    <a href="login.html">Login</a>
    </div>
    <div class="help">
        <a href="contact.html">Help?</a>
    </div>
    <hr>
    <div class="footer">
        <p>@ 2026 StudentHub Portal</p>
    </div>
    </body>
</html>
