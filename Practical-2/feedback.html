<!DOCTYPE html>
<html>
<head>
    <title>Feedback</title>
    <link rel="stylesheet" href="../CSS/feedback.css">
</head>
<body>
<div class="header">
    <img src="../Images/logo.png" class="logo">
    <h1 class="title">StudentHub</h1>
    <div class="navbar">
        <a href="../index.html">Home</a>
        <a href="profile.html">Profile</a>
    </div>
</div>
<div class="feedback-box">
    <h1>We value your Feedback!</h1>
    <p>Help us improve StudentHub Portal</p>
    <form>
        <label>Feedback Type</label><br>
        <select>
            <option>Select Feedback Type</option>
            <option>Suggestion</option>
            <option>Complaint</option>
            <option>Bug Report</option>
            <option>General Feedback</option>
        </select>
        <br><br>
        <label>Your Feedback</label><br>
        <textarea placeholder="Write your feedback here..."></textarea>
        <br><br>
        <button type="submit">Submit Feedback</button>
    </form>
    </div>
    <div class="help">
        <a href="contact.html">Help?</a>
    </div>
    <div class="footer">
    <p>©2026 StudentHub Portal</p>
    </div>

</html>
